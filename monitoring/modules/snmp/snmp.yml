# snmp_exporter — módulos FortiGate y Synology (estándar Xatélite)
# La community NO se escribe aquí: snmp_exporter la lee de la variable de
# entorno SNMP_COMMUNITY gracias a --config.expand-environment-variables.
# Modulos a medida para FortiGate y Synology, con OIDs explicitos
# (no hace falta compilar MIBs con el generator)

auths:
  xat_v2:
    community: ${SNMP_COMMUNITY}
    version: 2

modules:

  # ─── FortiGate ────────────────────────────────────────────────────────
  fortigate:
    walk:
      - 1.3.6.1.2.1.1                 # system (sysDescr, sysUpTime, sysName)
      - 1.3.6.1.4.1.12356.101.4.1     # fgSystemInfo
    metrics:
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3
        type: gauge
        help: Tiempo desde el ultimo arranque en centesimas de segundo

      - name: fgSysCpuUsage
        oid: 1.3.6.1.4.1.12356.101.4.1.3
        type: gauge
        help: Porcentaje de uso de CPU

      - name: fgSysMemUsage
        oid: 1.3.6.1.4.1.12356.101.4.1.4
        type: gauge
        help: Porcentaje de uso de memoria

      - name: fgSysMemCapacity
        oid: 1.3.6.1.4.1.12356.101.4.1.5
        type: gauge
        help: Memoria RAM total en KB

      - name: fgSysDiskUsage
        oid: 1.3.6.1.4.1.12356.101.4.1.6
        type: gauge
        help: Espacio de disco usado en MB

      - name: fgSysDiskCapacity
        oid: 1.3.6.1.4.1.12356.101.4.1.7
        type: gauge
        help: Espacio de disco total en MB

      - name: fgSysSesCount
        oid: 1.3.6.1.4.1.12356.101.4.1.8
        type: gauge
        help: Numero de sesiones activas

      - name: fgSysLowMemUsage
        oid: 1.3.6.1.4.1.12356.101.4.1.9
        type: gauge
        help: Uso de memoria baja en porcentaje

  # ─── Synology ─────────────────────────────────────────────────────────
  synology:
    walk:
      - 1.3.6.1.2.1.1                 # system
      - 1.3.6.1.2.1.25.2.3.1          # hrStorage (volumenes)
      - 1.3.6.1.4.1.6574.1            # synoSystem
      - 1.3.6.1.4.1.6574.2.1.1        # synoDisk
      - 1.3.6.1.4.1.6574.3.1.1        # synoRaid
    metrics:
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3
        type: gauge
        help: Tiempo desde el ultimo arranque en centesimas de segundo

      # Estado general del sistema. 1 = Normal, 2 = Failed
      - name: synoSystemStatus
        oid: 1.3.6.1.4.1.6574.1.1
        type: gauge
        help: Estado del sistema (1 Normal, 2 Failed)

      - name: synoTemperature
        oid: 1.3.6.1.4.1.6574.1.2
        type: gauge
        help: Temperatura del sistema en grados Celsius

      # 1 = Normal, 2 = Failed
      - name: synoPowerStatus
        oid: 1.3.6.1.4.1.6574.1.3
        type: gauge
        help: Estado de la fuente de alimentacion (1 Normal, 2 Failed)

      - name: synoSystemFanStatus
        oid: 1.3.6.1.4.1.6574.1.4.1
        type: gauge
        help: Estado del ventilador del sistema (1 Normal, 2 Failed)

      - name: synoCpuFanStatus
        oid: 1.3.6.1.4.1.6574.1.4.2
        type: gauge
        help: Estado del ventilador de CPU (1 Normal, 2 Failed)

      # 1 = Disponible, 2 = Al dia, 3 = Conectando, 4 = Desconectado, 5 = Otros
      - name: synoUpgradeAvailable
        oid: 1.3.6.1.4.1.6574.1.5.4
        type: gauge
        help: Hay actualizacion de DSM disponible (1 si, 2 al dia)

      # Estado de cada disco. 1 = Normal, 2 = Initialized, 3 = NotInitialized,
      # 4 = SystemPartitionFailed, 5 = Crashed
      - name: synoDiskStatus
        oid: 1.3.6.1.4.1.6574.2.1.1.5
        type: gauge
        help: Estado del disco (1 Normal, 4 SystemPartitionFailed, 5 Crashed)
        indexes:
          - labelname: diskIndex
            type: gauge
        lookups:
          - labels: [diskIndex]
            labelname: disk_id
            oid: 1.3.6.1.4.1.6574.2.1.1.2
            type: DisplayString

      - name: synoDiskTemperature
        oid: 1.3.6.1.4.1.6574.2.1.1.6
        type: gauge
        help: Temperatura del disco en grados Celsius
        indexes:
          - labelname: diskIndex
            type: gauge
        lookups:
          - labels: [diskIndex]
            labelname: disk_id
            oid: 1.3.6.1.4.1.6574.2.1.1.2
            type: DisplayString

      # Estado del RAID. 1 = Normal, 2 = Repairing, 3 = Migrating,
      # 4 = Expanding, 5 = Deleting, 6 = Creating, 7 = RaidSyncing,
      # 8 = RaidParityChecking, 9 = RaidAssembling, 10 = Canceling,
      # 11 = Degrade, 12 = Crashed
      - name: synoRaidStatus
        oid: 1.3.6.1.4.1.6574.3.1.1.3
        type: gauge
        help: Estado del volumen RAID (1 Normal, 11 Degrade, 12 Crashed)
        indexes:
          - labelname: raidIndex
            type: gauge
        lookups:
          - labels: [raidIndex]
            labelname: raid_name
            oid: 1.3.6.1.4.1.6574.3.1.1.2
            type: DisplayString

      # Volumenes via HOST-RESOURCES. El indice cambia entre reinicios,
      # por eso se etiqueta con el nombre del punto de montaje.
      - name: hrStorageSize
        oid: 1.3.6.1.2.1.25.2.3.1.5
        type: gauge
        help: Tamano total en unidades de asignacion
        indexes:
          - labelname: hrStorageIndex
            type: gauge
        lookups:
          - labels: [hrStorageIndex]
            labelname: mountpoint
            oid: 1.3.6.1.2.1.25.2.3.1.3
            type: DisplayString

      - name: hrStorageUsed
        oid: 1.3.6.1.2.1.25.2.3.1.6
        type: gauge
        help: Espacio usado en unidades de asignacion
        indexes:
          - labelname: hrStorageIndex
            type: gauge
        lookups:
          - labels: [hrStorageIndex]
            labelname: mountpoint
            oid: 1.3.6.1.2.1.25.2.3.1.3
            type: DisplayString

      - name: hrStorageAllocationUnits
        oid: 1.3.6.1.2.1.25.2.3.1.4
        type: gauge
        help: Tamano de la unidad de asignacion en bytes
        indexes:
          - labelname: hrStorageIndex
            type: gauge
        lookups:
          - labels: [hrStorageIndex]
            labelname: mountpoint
            oid: 1.3.6.1.2.1.25.2.3.1.3
            type: DisplayString
