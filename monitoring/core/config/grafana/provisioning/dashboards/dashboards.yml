apiVersion: 1

providers:
  - name: xatelite
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 60
    allowUiUpdates: false        # los cambios se hacen en el repo, no en la UI
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
